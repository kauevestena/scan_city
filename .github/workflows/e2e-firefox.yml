# E2E no Firefox (REQ-NFR-009, ADR-039): a mesma suíte do Chromium, toda segunda-feira e no
# disparo manual. Não publica nada; se falhar, guarda o relatório do Playwright.
name: E2E no Firefox

on:
  schedule:
    # Segunda-feira, 07:17 UTC (fora da hora cheia, quando os agendamentos se acumulam).
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-firefox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run e2e:firefox
      - name: Guarda o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firefox
          path: |
            playwright-report/
            test-results/
          retention-days: 14
