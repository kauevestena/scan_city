# CI e publicação no GitHub Pages (https://kauevestena.github.io/scan_city/).
#
# Em todo push na main, em todo pull request e no disparo manual, dois jobs em paralelo:
# - `build`: instala, roda o `verify` (typecheck, lint, testes com os limites de cobertura, build,
#   placeholders e termos) e confere os assets;
# - `e2e`: a suíte Playwright inteira no Chromium (ADR-039), com o relatório guardado se falhar.
# Só a main publica o `dist/`, e só depois dos dois jobs verdes (ADR-028 e ADR-039, em
# specs/decisions.md); o disparo manual em outra branch só valida. Em Settings → Pages, a "Source"
# precisa ser "GitHub Actions". O Firefox roda toda semana em `e2e-firefox.yml`.
name: CI e publicação no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez, e um PR novo cancela a execução velha do mesmo PR (a da main nunca é
# cancelada no meio da publicação).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:assets
      - name: Empacota o site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Guarda o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
